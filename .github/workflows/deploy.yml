name: Deploy to GitHub Pages

on:
 push:
    branches:
      - main

jobs:
 deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Replace placeholder with secret
        run: |
          sed -i 's/API_KEY_PLACEHOLDER/${{ vars.API_GITHUB }}/g' src/env/env.prod.ts

      - name: Deploy to GitHub Pages
        run: |
          ng deploy --base-href="https://Mach131.github.io/serpexceed/"